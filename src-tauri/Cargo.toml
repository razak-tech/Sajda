[package]
name = "sajda"
version = "0.1.0"
edition = "2024"
description = "Prayer times in the Windows system tray"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["time"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
